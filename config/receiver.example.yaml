# Base-station receiver configuration — canonical example.
#
# Copy this file to config/receiver.yaml on the receiver Pi and edit.
# The YAML schema is validated by src/base_station/config.py at load time;
# invalid files raise ConfigError with a specific field name.

station:
  station_id: "BASE-01"          # Receiver's identifier in logs

pins:
  lora_cs: 7                     # RFM95W SPI chip select (default 7 for the
                                 # Adafruit LoRa Bonnet on a Pi)
  lora_reset: 25                 # RFM95W reset

lora:
  # CRITICAL: every field below MUST match the senders' lora block. SF/BW/CR/
  # preamble mismatch causes 100% silent packet loss at the preamble detector.
  frequency: 915.0               # MHz — must match the senders' frequency
  tx_power: 23                   # dBm, used for ACK transmissions
  spreading_factor: 12           # 6-12; must match senders
  signal_bandwidth_hz: 125000    # must match senders
  coding_rate: 5                 # 5..8 (== 4/5..4/8); must match senders
  preamble_length: 8             # symbols; must match senders
  ack_timeout_seconds: 6.0       # sender-only field; ignored on receiver

storage:
  data_dir: "/home/admin/data"   # per-station folders are created here
  fsync: true                    # fsync packets.csv after each append; one write
                                 # per received packet. Metrics are flush-only
                                 # regardless (30s cadence would wear the SD card).

# Senders we will accept and ACK. Add a line per station; unknown senders
# are logged but not ACKed (so they retry into the void).
stations:
  - id: "DAVIES-01"
    label: "Davies prototype #1"
  # - id: "DAVIES-02"
  #   label: "Davies prototype #2"

metrics:
  sample_interval_seconds: 30    # Pi system-metrics sampling cadence

display:
  enabled: true                  # SSD1306 OLED on the bonnet shows live link
                                 # status (RSSI/SNR/age). A missing OLED is
                                 # ignored at runtime; set false to skip it.
