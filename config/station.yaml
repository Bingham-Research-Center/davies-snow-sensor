station:
  id: "DAVIES-01"
  sensor_height_cm: 203.00
  hardware_profile: "52pi-ep0123"

pins:
  ds18b20_data: 4
  lora_cs: 7
  lora_reset: 25

sensors:
  ultrasonic:
    - id: "east_1"
      trigger_pin: 5
      echo_pin: 6
    - id: "east_2"
      trigger_pin: 13
      echo_pin: 19
    - id: "west_1"
      trigger_pin: 20
      echo_pin: 21
    # west_2 (HC-SR04, GPIO 27/26) retired 2026-06-08: VCC conductor open
    # mid-bundle, never reliable. Replaced by MaxBotix MB7374 on USB-TTL serial
    # (see sensors.maxbotix below).
  maxbotix:
    - id: "mb7374"            # MaxBotix MB7374 (HRXL-MaxSonar-WRS), serial MBBZRJTT
      # pinned by serial-number path so it survives ttyUSB* renumbering when the
      # A02YYUW adapter is added later
      serial_port: "/dev/serial/by-id/usb-MaxBotix_MB7374-1XX_HRXL-MaxSonar-WRS_MBBZRJTT-if00-port0"
      baud_rate: 9600          # MB7374 default; TTL 8N1, streams R<mm> at ~6 Hz

lora:
  # CRITICAL: every field below MUST match the peer's lora block on the base
  # station. SF/BW/CR/preamble mismatch causes 100% silent packet loss — the
  # RFM9x never decodes the preamble and you'll only see lora_ack_timeout.
  frequency: 915.0
  tx_power: 23
  spreading_factor: 12          # matched to BASE-01 receiver.yaml for ~4700 ft range; safe now that airtime.py sizes xmit_timeout (old fixed 2.0s timeout silently truncated SF12)
  signal_bandwidth_hz: 125000
  coding_rate: 5
  preamble_length: 8
  ack_timeout_seconds: 10.0

storage:
  csv_path: "/home/admin/data/snow_data.csv"

timing:
  cycle_interval_minutes: 15

qc:
  num_samples: 31
  inter_pulse_delay_ms: 60
  min_valid_fraction: 0.5
  max_spread_cm: 5.0
