station:
  id: "DAVIES-01"
  sensor_height_cm: 203.00
  hardware_profile: "52pi-ep0123"

pins:
  ds18b20_data: 4
  lora_cs: 7
  lora_reset: 25

sensors:
  ultrasonic:
    - id: "east_1"
      trigger_pin: 5
      echo_pin: 6
    - id: "east_2"
      trigger_pin: 13
      echo_pin: 19
    - id: "west_1"
      trigger_pin: 20
      echo_pin: 21
    # west_2 disabled 2026-05-15: VCC conductor open mid-bundle
    # (Pi end 5 V, sensor end 0 V). Re-enable after final wiring fixes the bundle.
    # - id: "west_2"
    #   trigger_pin: 27
    #   echo_pin: 26

lora:
  # CRITICAL: every field below MUST match the peer's lora block on the base
  # station. SF/BW/CR/preamble mismatch causes 100% silent packet loss — the
  # RFM9x never decodes the preamble and you'll only see lora_ack_timeout.
  frequency: 915.0
  tx_power: 23
  spreading_factor: 7           # rolled back to lib defaults — SF12 max-range preset wasn't ACKing on this hardware
  signal_bandwidth_hz: 125000
  coding_rate: 5
  preamble_length: 8
  ack_timeout_seconds: 10.0

storage:
  csv_path: "/home/admin/data/snow_data.csv"

timing:
  cycle_interval_minutes: 15

qc:
  num_samples: 31
  inter_pulse_delay_ms: 60
  min_valid_fraction: 0.5
  max_spread_cm: 5.0
