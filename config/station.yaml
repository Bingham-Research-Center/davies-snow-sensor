station:
  id: "DAVIES-01"
  sensor_height_cm: 203.00
  hardware_profile: "52pi-ep0123"

pins:
  ds18b20_data: 4
  lora_cs: 7
  lora_reset: 25

sensors:
  ultrasonic:
    - id: "east_1"
      trigger_pin: 5
      echo_pin: 6
    - id: "east_2"
      trigger_pin: 13
      echo_pin: 19

lora:
  # CRITICAL: every field below MUST match the peer's lora block on the base
  # station. SF/BW/CR/preamble mismatch causes 100% silent packet loss — the
  # RFM9x never decodes the preamble and you'll only see lora_ack_timeout.
  frequency: 915.0
  tx_power: 23
  spreading_factor: 12          # 6-12; higher = longer range, longer ToA
  signal_bandwidth_hz: 125000   # 7800,10400,15600,20800,31250,41700,62500,125000,250000,500000
  coding_rate: 8                # 5..8 (== 4/5..4/8 FEC; higher = stronger error correction)
  preamble_length: 12           # symbols; longer helps RX lock at low SNR
  ack_timeout_seconds: 20.0     # ~9s ToA + ~1.5s ACK at SF12/BW125

storage:
  csv_path: "/home/admin/data/snow_data.csv"

timing:
  cycle_interval_minutes: 15

qc:
  num_samples: 31
  inter_pulse_delay_ms: 60
  min_valid_fraction: 0.5
  max_spread_cm: 5.0
