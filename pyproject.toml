[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "davies-snow-sensor"
version = "0.1.0"
description = "Davies Snow Sensor software stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
hardware = [
    "RPi.GPIO>=0.7.1,<1.0",
    "gpiozero>=2.0,<3.0",
    "adafruit-blinka>=8.0.0,<9.0",
    "adafruit-circuitpython-rfm9x>=2.0.0,<3.0",
    "adafruit-circuitpython-ssd1306>=2.12,<3.0",
    "w1thermsensor>=2.0,<3.0",
    "lgpio>=0.2.2,<1.0",
    "pigpio>=1.78,<2.0",
    "pyserial>=3.5,<4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
snow-sensor = "snowsensor.sensor.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snowsensor*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Tests and scripts stub hardware modules in sys.modules before importing.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that require real Pi hardware (skipped by default on CI)",
]
